include:
  - project: 'espressif/shared-ci-dangerjs'
    ref: master
    file: 'danger.yaml'

stages:
  - danger
  - codecheck
  - get_idf
  - test

# WORKFLOW RULES
# ------------------------------------------------------------------------------------------------------
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
# ------------------------------------------------------------------------------------------------------

# TEMPLATES
# ------------------------------------------------------------------------------------------------------
.base_template:
  # Current Debian. python:3.11-bullseye can no longer upgrade git: the
  # bullseye-security package the image asks for is gone from the mirror.
  image: python:3.11
  tags:
    - build
    - internet
  before_script:
    - pip install -e .[dev] --prefer-binary
# ------------------------------------------------------------------------------------------------------

# JOBS
# ------------------------------------------------------------------------------------------------------

# CODE CHECK BY PRE-COMMIT HOOKS
pre-commit_hooks_MR:
  extends: .base_template
  stage: codecheck
  needs: []
  script:
    - apt-get update && apt-get install -y -q git
    - git diff-tree --no-commit-id --name-only -r $CI_COMMIT_SHA | xargs pre-commit run --files
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
# ------------------------------------------------------------------------------------------------------

get_idf_for_target_test:
  image: python:3.11
  stage: get_idf
  needs: []
  artifacts:
    paths:
      - "$CI_PROJECT_DIR/artifacts/nvs_partition_tool/*.py"
      - "$CI_PROJECT_DIR/artifacts/nvs_partition_tool/pytest.ini"
      - "$CI_PROJECT_DIR/artifacts/nvs_partition_generator/testdata"
      - "$CI_PROJECT_DIR/artifacts/idf/tools/mass_mfg"
    when: always
    expire_in: 1 week
  script:
    - git clone -b master --depth 1 https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}/espressif/esp-idf /tmp/idf
    - cd $CI_PROJECT_DIR
    - mkdir -p artifacts/idf/tools
    - cp -r /tmp/idf/components/nvs_flash/nvs_partition_tool $CI_PROJECT_DIR/artifacts/nvs_partition_tool
    - cp -r /tmp/idf/components/nvs_flash/nvs_partition_generator $CI_PROJECT_DIR/artifacts/nvs_partition_generator
    - cp -r /tmp/idf/tools/mass_mfg $CI_PROJECT_DIR/artifacts/idf/tools/mass_mfg

target_test:
  image: python:3.11
  stage: test
  needs:
    - get_idf_for_target_test
  script:
    - pip install pytest-embedded-idf
    - pip install -e .
    - cd artifacts/nvs_partition_tool
    # test_paths_with_spaces.py reads IDF_PATH while the module is imported.
    - IDF_PATH=$CI_PROJECT_DIR/artifacts/idf pytest
